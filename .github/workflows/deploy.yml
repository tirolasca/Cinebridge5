# Deploy por SSH em qualquer VM com Docker (provedor-agnóstico). Só roda depois do CI verde na main,
# ou manualmente. Os segredos vivem no GitHub Environment "producao" e o .env.prod fica SOMENTE no servidor.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Configura SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Atualiza e reinicia no servidor
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USUARIO: ${{ secrets.DEPLOY_USER }}
          CAMINHO: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USUARIO@$HOST" "set -e; cd '$CAMINHO'; sh scripts/backup.sh; git fetch --prune origin main; git reset --hard origin/main; docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans; docker image prune -f"
      - name: Smoke test público
        env:
          URL: ${{ secrets.DEPLOY_URL }}
        run: |
          sleep 20
          curl -fsS --retry 6 --retry-delay 10 "$URL/health"
