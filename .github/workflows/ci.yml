name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  node:
    name: ${{ matrix.servico }} (lockfile, tipos, testes, build, auditoria)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servico: [api, profissionais, projetos, notificacoes, governanca, admin]
    defaults:
      run:
        working-directory: services/${{ matrix.servico }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/${{ matrix.servico }}/package-lock.json
      - run: npm ci                       # falha se o lockfile divergir do package.json
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  frontend:
    name: frontend (lockfile, tipos, lint, formatação, testes, build, auditoria)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: docker compose config (local e produção)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.yml config -q
      - name: Produção (segredos gerados só para validar)
        run: |
          sh scripts/gerar-segredos.sh
          sed -i 's|^ADMIN_PASSWORD_HASH=.*|ADMIN_PASSWORD_HASH=ci|' .env.prod
          docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml --profile observabilidade-completa config -q
      - name: Produção sem segredos deve ser recusada
        run: "! docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q 2>/dev/null"
      - name: Nenhuma imagem com tag latest
        run: "! docker compose -f docker-compose.yml config | grep -E 'image: .*:latest'"

  imagens:
    name: imagem ${{ matrix.servico }} (hadolint, build, Trivy)
    runs-on: ubuntu-latest
    needs: [node, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { servico: api, contexto: services/api, dockerfile: services/api/Dockerfile }
          - { servico: profissionais, contexto: services/profissionais, dockerfile: services/profissionais/Dockerfile }
          - { servico: projetos, contexto: services/projetos, dockerfile: services/projetos/Dockerfile }
          - { servico: notificacoes, contexto: services/notificacoes, dockerfile: services/notificacoes/Dockerfile }
          - { servico: governanca, contexto: services/governanca, dockerfile: services/governanca/Dockerfile }
          - { servico: admin, contexto: ., dockerfile: services/admin/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        run: docker run --rm -i hadolint/hadolint < ${{ matrix.dockerfile }}
      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t cinebridge/${{ matrix.servico }}:ci ${{ matrix.contexto }}
      - name: Executa como usuário não-privilegiado
        run: test "$(docker run --rm --entrypoint id cinebridge/${{ matrix.servico }}:ci -u)" != "0"
      - name: Trivy (HIGH/CRITICAL com correção disponível)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 cinebridge/${{ matrix.servico }}:ci
