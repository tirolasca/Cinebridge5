global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Microsserviços: descobertos pelo Docker (rótulo cinebridge.metrics=true).
  # Assim as réplicas criadas pela governança entram no scraping automaticamente.
  - job_name: cinebridge-servicos
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["cinebridge.metrics=true"]
    relabel_configs:
      - source_labels: [__meta_docker_network_name]
        regex: cinebridge-net
        action: keep
      - source_labels: [__meta_docker_container_label_cinebridge_servico]
        target_label: servico
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: instance
      - source_labels: [__meta_docker_network_ip, __meta_docker_container_label_cinebridge_metrics_port]
        separator: ":"
        target_label: __address__

  # RabbitMQ: plugin rabbitmq_prometheus (já habilitado na imagem), métricas agregadas...
  - job_name: rabbitmq
    static_configs:
      - targets: ["cinebridge-mq:15692"]

  # ...e métricas por fila (mensagens prontas / não confirmadas)
  - job_name: rabbitmq-filas
    metrics_path: /metrics/detailed
    params:
      family: ["queue_coarse_metrics"]
    static_configs:
      - targets: ["cinebridge-mq:15692"]

  # CPU/memória por container
  - job_name: cadvisor
    static_configs:
      - targets: ["cinebridge-cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
